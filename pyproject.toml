[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jettison-ai"
version = "0.1.0"
description = "Jettison — dump the context your agent never uses. One command. MCP schemas, skills, instructions, tool outputs, history. Verified answer quality."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Saurabh Yergattikar" }]
keywords = [
    "llm", "agents", "mcp", "tokens", "context", "optimization",
    "claude", "codex", "cursor", "openclaw", "compression", "proxy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
# Full runtime optimization: Headroom core (retained, attributed — see NOTICE).
# Pinned minor: upstream moves fast (160+ releases); selective upgrades only.
runtime = ["headroom-ai>=0.32.0,<0.33", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = ["jettison-ai[runtime]"]

[project.scripts]
jettison = "jettison.cli:main"
jet = "jettison.cli:main"

[project.urls]
Homepage = "https://github.com/jettison-ai/jettison"
Documentation = "https://github.com/jettison-ai/jettison/tree/main/docs"

[tool.setuptools.packages.find]
include = ["jettison*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
